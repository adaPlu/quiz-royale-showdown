name: Check Cloudflare Pages deployment

on:
  push:
    branches:
      - agent/check-web-deployment

jobs:
  inspect-pages:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Query Pages deployments
        run: |
          npx wrangler@latest pages deployment list --project-name quiz-royale-showdown --json > deployments.json
          cat deployments.json
      - name: Upload deployment snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-deployments
          path: deployments.json
          if-no-files-found: error

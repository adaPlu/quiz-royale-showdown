name: Rebuild Beta APK

on:
  pull_request:
    branches:
      - Railway-API-Implementation

permissions:
  contents: read

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-quiz-royale-showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build installable beta APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-v1.1-code2-beta-apk
          path: android-quiz-royale-showdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

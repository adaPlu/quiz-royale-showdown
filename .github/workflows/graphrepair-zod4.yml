name: graphRepair Zod 4 repair

on:
  push:
    branches:
      - dependabot/npm_and_yarn/railway-api/zod-4.5.4

permissions:
  contents: write

jobs:
  repair-zod4:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizroyale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quizroyale_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/quizroyale_ci
      PGSSL: disable
      NODE_ENV: test
      RUN_DATABASE_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal Zod 4 schema migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("railway-api/src/server.ts")
          old = '  categoryPoints: z.record(z.number().int().nonnegative().max(1_000_000)),'
          new = '  categoryPoints: z.record(z.string(), z.number().int().nonnegative().max(1_000_000)),'
          text = path.read_text()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy z.record call, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install Railway API dependencies
        run: npm ci --prefix railway-api
      - name: Typecheck and build Railway API
        run: npm run build --prefix railway-api
      - name: Apply all Railway migrations
        run: npm run migrate --prefix railway-api
      - name: Run Railway API tests
        run: npm test --prefix railway-api
      - name: Commit verified source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add railway-api/src/server.ts
          git commit -m "fix(railway-api): migrate categoryPoints record to Zod 4"
          git push origin HEAD:${{ github.ref_name }}

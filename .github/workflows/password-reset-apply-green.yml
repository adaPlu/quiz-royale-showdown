name: Password Reset Apply Green

on:
  push:
    branches:
      - graphrepair/password-reset-email-delivery
    paths:
      - ".github/workflows/password-reset-apply-green.yml"

permissions:
  contents: write

jobs:
  apply-minimal-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: graphrepair/password-reset-email-delivery
          fetch-depth: 0
      - name: Add sanitized provider-acceptance evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path("railway-api/src/server.ts")
          source = path.read_text()
          needle = '  if (!response.ok) throw new Error(`email provider returned ${response.status}`);\n}'
          replacement = '  if (!response.ok) throw new Error(`email provider returned ${response.status}`);\n  console.info("password reset email accepted", record.user_id, response.status);\n}'
          if source.count(needle) != 1:
              raise SystemExit(f"expected exactly one password-reset provider boundary, found {source.count(needle)}")
          path.write_text(source.replace(needle, replacement, 1))
      - name: Commit minimal implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add railway-api/src/server.ts
          git commit -m "fix: record password reset provider acceptance"
          git push origin HEAD:graphrepair/password-reset-email-delivery

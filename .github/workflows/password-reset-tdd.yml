name: Password Reset TDD

on:
  push:
    branches:
      - graphrepair/password-reset-email-delivery
    paths:
      - "railway-api/**"
      - ".github/workflows/password-reset-tdd.yml"

permissions:
  contents: read

jobs:
  railway-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railway-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: railway-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - Railway-API-Implementation
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-web-pages.yml"
  workflow_dispatch:
    inputs:
      pages_branch:
        description: "Cloudflare Pages branch label"
        required: false
        default: "Railway-API-Implementation"
      project_name:
        description: "Cloudflare Pages project name"
        required: false
        default: "quiz-royale-showdown"

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy web client
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_NAME: ${{ github.event.inputs.project_name || 'quiz-royale-showdown' }}
      PAGES_BRANCH: ${{ github.event.inputs.pages_branch || 'Railway-API-Implementation' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install web dependencies
        run: npm install --prefix webapp

      - name: Build production web bundle
        run: npm run build --prefix webapp

      - name: Deploy to Cloudflare Pages
        working-directory: webapp
        run: >-
          npx wrangler@latest pages deploy dist
          --project-name "$PROJECT_NAME"
          --branch "$PAGES_BRANCH"
          --commit-hash "${{ github.sha }}"

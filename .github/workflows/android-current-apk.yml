name: Android Current 1.9 APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-current-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build current APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_RAILWAY_API_URL: https://railway-api-production-5772.up.railway.app
      EXPO_PUBLIC_RORK_FUNCTIONS_URL: https://quiz-royale-functions.adapluguez.workers.dev

    defaults:
      run:
        working-directory: android-quiz-royale-showdown

    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify version
        run: |
          grep 'versionCode = 1787428688' app/build.gradle.kts
          grep 'versionName = "1.9"' app/build.gradle.kts

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug and unsigned release APKs
        run: ./gradlew clean :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/QuizRoyaleShowdown-v1.9-code1787428688-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/QuizRoyaleShowdown-v1.9-code1787428688-release-unsigned.apk
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quiz-royale-current-v1.9-code1787428688-apks
          path: android-quiz-royale-showdown/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

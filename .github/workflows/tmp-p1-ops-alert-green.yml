name: Temporary P1 Ops Alert GREEN

on:
  push:
    branches:
      - graphrepair/p1-ops-alert-certification

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: graphrepair/p1-ops-alert-certification
      - name: Apply minimal implementation
        run: python .github/scripts/tmp_p1_ops_alert_green.py
      - name: Verify and commit GREEN
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p1-ops-alert-green.yml
          rm .github/scripts/tmp_p1_ops_alert_green.py
          npm ci --prefix railway-api
          npm run build --prefix railway-api
          npm test --prefix railway-api
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add protected operational alert certification endpoint'
          git push origin HEAD:graphrepair/p1-ops-alert-certification

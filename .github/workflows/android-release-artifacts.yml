name: Android Release Artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_RAILWAY_API_URL: https://railway-api-production-5772.up.railway.app
      EXPO_PUBLIC_RORK_FUNCTIONS_URL: https://quiz-royale-functions.adapluguez.workers.dev

    defaults:
      run:
        working-directory: android-quiz-royale-showdown

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK and release APK/AAB
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/QuizRoyaleShowdown-v1.8-code1787428687-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/QuizRoyaleShowdown-v1.8-code1787428687-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab release-artifacts/QuizRoyaleShowdown-v1.8-code1787428687-release-unsigned.aab
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-android-v1.8-code1787428687
          path: android-quiz-royale-showdown/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

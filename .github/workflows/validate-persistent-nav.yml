name: Validate persistent navigation

on:
  push:
    branches:
      - agent/validate-persistent-nav

jobs:
  android-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-quiz-royale-showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android debug Kotlin
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

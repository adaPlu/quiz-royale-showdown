name: Build Quiz Royale beta APK

on:
  push:
    branches:
      - agent/validate-persistent-nav

jobs:
  android-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-quiz-royale-showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable beta APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Stage beta APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../quiz-royale-showdown-v1.1-beta.apk
      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-showdown-v1.1-beta-apk
          path: quiz-royale-showdown-v1.1-beta.apk
          if-no-files-found: error

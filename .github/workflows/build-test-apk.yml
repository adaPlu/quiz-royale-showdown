name: Build Test APK

on:
  push:
    branches:
      - agent/build-test-apk
  pull_request:
    branches:
      - Railway-API-Implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-quiz-royale-showdown/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: android-quiz-royale-showdown

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android-quiz-royale-showdown

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-debug-apk
          path: android-quiz-royale-showdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Build Unsigned Release APK and AAB

on:
  push:
    branches:
      - agent/build-release-v1-1-signed-local
  pull_request:
    branches:
      - Railway-API-Implementation

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_RAILWAY_API_URL: https://railway-api-production-5772.up.railway.app
      EXPO_PUBLIC_RORK_FUNCTIONS_URL: https://quiz-royale-functions.adapluguez.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android-quiz-royale-showdown

      - name: Build unsigned release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
        working-directory: android-quiz-royale-showdown

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-v1.1-code2-release-apk-unsigned
          path: android-quiz-royale-showdown/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-v1.1-code2-release-aab-unsigned
          path: android-quiz-royale-showdown/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

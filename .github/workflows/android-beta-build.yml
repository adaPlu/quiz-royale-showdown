name: Android beta APK build

on:
  pull_request:
    branches:
      - Railway-API-Implementation

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-quiz-royale-showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build beta APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Stage APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../quiz-royale-showdown-v1.1-beta.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-royale-showdown-v1.1-beta-apk
          path: quiz-royale-showdown-v1.1-beta.apk
          if-no-files-found: error
